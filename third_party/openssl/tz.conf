# The target of OpenSSL that build.ps1 configures: VC-WIN64A (NASM for the assembly), compiled by
# clang-cl, without debug information. /Gy (from VC-WIN64A) and /Gw put each function and each
# variable in a section of its own, so that the linker keeps only what a program reaches
# (docs/crypto.md, section 3). /MT /Zl: the static CRT, which tz links, without naming it in the
# objects.
my %targets = (
    "tz-win64" => {
        inherit_from => [ "VC-WIN64A" ],
        CC           => "clang-cl",
        AR           => "llvm-lib",
        CFLAGS       => "/W3 /wd4090 /nologo /O2 /Gw -Wno-everything",
        lib_cflags   => "/MT /Zl",
        ASFLAGS      => "",
    },
);
